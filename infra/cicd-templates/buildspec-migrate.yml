# Migrate ステージ: Build で登録したタスク定義を使い、DB マイグレーションを run-task で実行する
# マイグレーションは旧バージョンのアプリと互換のある変更（expand/contract）に限る
version: 0.2

env:
  shell: bash
  variables:
    # アプリのマイグレーションコマンド（JSON 配列）。空文字の場合はスキップする
    MIGRATION_COMMAND: '["./bin/migrate"]'

phases:
  build:
    commands:
      - set -eo pipefail
      - |
        if [ -z "${MIGRATION_COMMAND}" ]; then
          echo "MIGRATION_COMMAND is empty. Skip migration."
        else
          TASK_DEFINITION_ARN=$(cat "${CODEBUILD_SRC_DIR_BuildOutput}/taskdef-arn.txt")
          OVERRIDES=$(jq -n --arg name "${CONTAINER_NAME}" --argjson cmd "${MIGRATION_COMMAND}" \
            '{containerOverrides: [{name: $name, command: $cmd}]}')
          TASK_ARN=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${TASK_SUBNETS}],securityGroups=[${TASK_SECURITY_GROUP}],assignPublicIp=DISABLED}" \
            --overrides "${OVERRIDES}" \
            --started-by "codepipeline-migrate" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: ${TASK_ARN}"

          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" \
            --query "tasks[0].containers[?name=='${CONTAINER_NAME}'].exitCode | [0]" --output text)
          echo "Migration exit code: ${EXIT_CODE}"
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "Migration failed."
            exit 1
          fi
        fi
